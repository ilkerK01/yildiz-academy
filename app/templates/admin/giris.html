<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Yıldız Academy</title>
<link rel="preload" as="image" href="/static/img/imlec/varsayilan.svg">
<link rel="preload" as="image" href="/static/img/imlec/basili.svg">
<link rel="icon" type="image/png" sizes="64x64" href="/static/img/favicon.png">
<link rel="apple-touch-icon" href="/static/img/favicon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Google+Sans+Code:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/css/tokens.css?v={{ statik_surum('css/tokens.css') }}">
<link rel="stylesheet" href="/static/css/base.css?v={{ statik_surum('css/base.css') }}">
<link rel="stylesheet" href="/static/css/app.css?v={{ statik_surum('css/app.css') }}">
<style>
  /* Yönetici girişi açılış sayfasıyla aynı gökyüzünü kullanır. */
  .yonetim-giris{
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    gap:28px;
    background:
      linear-gradient(to bottom,rgba(8,11,18,.55),rgba(8,11,18,.82)),
      url("/static/img/hero-sky-poster.jpg") center / cover no-repeat fixed;
    color:#e9edf3;
  }
  .yonetim-giris__logo{
    display:flex;flex-direction:column;align-items:center;gap:12px;
    color:#f3f5f8;text-decoration:none;
  }
  .yonetim-giris__logo img{width:88px;height:88px;object-fit:contain;filter:drop-shadow(0 6px 24px rgba(0,0,0,.45))}
  .yonetim-giris__logo span{font:700 26px/1.1 var(--font-logo);letter-spacing:.01em}
  .yonetim-giris .giris__card{
    background:rgba(15,19,26,.78);
    border-color:rgba(255,255,255,.1);
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
  }
  .yonetim-giris .panel__head{background:transparent}
  .yonetim-giris .giris__body{padding-top:24px}
</style>
</head>
<body>
<section class="giris yonetim-giris">
  <a class="yonetim-giris__logo" href="/" aria-label="Yıldız Academy">
    <img src="/static/img/logo.png" alt="" width="88" height="88">
    <span>Yıldız Academy</span>
  </a>

  <div class="giris__card">
    <div class="panel__head">~/academy/admin</div>
    <div class="giris__body">
      <div class="giris__title">Yönetim.</div>
      <p class="lede" style="font-size:15px;margin:0">Bu kapı akademi hesaplarından ayrıdır.</p>
      <form class="form" method="post" action="/academy/admin/giris">
        <div>
          <label for="kullanici">Kullanıcı adı</label>
          <input id="kullanici" name="kullanici" autocomplete="username" required autofocus>
        </div>
        <div>
          <label for="parola">Parola</label>
          <input id="parola" name="parola" type="password" autocomplete="current-password" required>
        </div>
        {% if hata %}<div class="uyari">{{ hata }}</div>{% endif %}
        <button class="btn btn--lg btn--block" type="submit">Gir →</button>
      </form>
      <div class="giris__alt"><span></span><a href="/">siteye dön</a></div>
    </div>
  </div>
</section>
<script src="/static/js/app.js?v={{ statik_surum('js/app.js') }}"></script>
</body>
</html>
